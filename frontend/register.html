<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | ReClaim</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/api.js"></script>
    <script defer src="/js/auth.js"></script>
</head>
<body class="auth-page">
    <a class="brand auth-brand" href="/">Re<span>Claim</span></a>
    
    <main class="auth-card fade-in">
        <!-- Back to Home Button added here -->
        <a class="back-link" href="/">← Back to Home</a>
        <br>

        <span class="eyebrow">JOIN THE COMMUNITY</span>
        <h1>Create your account</h1>
        <p class="muted">Create an account to report and track belongings.</p>
        
        <form id="registerForm">
            <label>Full name
                <input name="name" required maxlength="80" autocomplete="name">
            </label>
            <label>Email address
                <input name="email" type="email" required autocomplete="email">
            </label>
            <label>Password
                <input name="password" type="password" minlength="8" required autocomplete="new-password">
                <small>At least 8 characters.</small>
            </label>
            <button class="btn full" type="submit">Create account</button>
            <p id="formMessage" class="message" aria-live="polite"></p>
        </form>
        <p class="auth-switch">Already registered? <a href="/login.html">Login</a></p>
    </main>
</body>
</html>
