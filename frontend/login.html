<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ReClaim</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/js/api.js"></script>
    <script defer src="/js/auth.js"></script>
</head>
<body class="auth-page">
    <a class="brand auth-brand" href="/">Re<span>Claim</span></a>
    
    <main class="auth-card fade-in">
        <a class="back-link" href="/">← Back to Home</a>
        <br>
        
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Login to ReClaim</h1>
        <p class="muted">Continue managing your reports and smart matches.</p>
        
        <form id="loginForm">
            <label>Email address
                <input name="email" type="email" required autocomplete="email">
            </label>
            <label>Password
                <input name="password" type="password" required autocomplete="current-password">
            </label>
            <button class="btn full" type="submit">Login</button>
            <p id="formMessage" class="message" aria-live="polite"></p>
        </form>
        <p class="auth-switch">New to ReClaim? <a href="/register.html">Create an account</a></p>
    </main>
</body>
</html>
